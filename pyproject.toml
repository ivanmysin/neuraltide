[project]
name = "neuraltide"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tensorflow>=2.16",
    "numpy>=1.26",
    "scipy>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "black", "ruff"]
vis = ["rich>=13.0"]
global = ["cma>=3.3"]
pareto = ["pymoo>=0.6"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuraltide*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# BLE001  — широкие `except Exception` в fallback-путях (пропуск старта /
#           узла профиля при любой ошибке) — сознательная политика пакета;
#           ошибки при этом логируются/попадают в результат.
# TRY004  — историческая конвенция пакета: неверный тип аргумента
#           вызывает ValueError (не TypeError); смена сломала бы вызовы
#           и тесты (pytest.raises(ValueError)).
# RUF012  — mutable class defaults (state_size = []) — устоявшийся
#           Keras-подобный паттерн описания формы состояния моделей.
ignore = [
    "BLE001",
    "TRY004",
    "RUF012",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = ["slow: long-running numerical or audit tests"]
